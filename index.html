<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hane Home Design</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans Arabic بۆ خوێندنەوەی ئاسان -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Arabic', sans-serif; /* فۆنتی نوێ */
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 2;
            width: 90%; /* ڕێکخستن بۆ مۆبایل */
            max-width: 400px;
            margin: 20px auto;
        }

        .card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ڕێکخستنی پروفایل */
        .profile-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #d4af37;
            overflow: hidden;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #fff;
        }

        p.bio {
            font-size: 14px;
            color: #d4af37;
            margin-bottom: 20px;
        }

        /* ڕێکخستنی دوگمەکان بۆ مۆبایل */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 14px 15px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ڕێکخستنی نموونەی کارەکان بۆ مۆبایل */
        .portfolio-section {
            margin-top: 25px;
        }

        .portfolio-slider {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }

        .portfolio-item {
            flex: 0 0 120px;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #d4af37;
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <div class="wrapper">
        <div class="card">
            <div class="profile-container">
                <div class="profile-img">
                    <img src="logo.jpeg" alt="Logo" style="width:100%">
                </div>
            </div>

            <h1>Hane Home Design</h1>
            <p class="bio">بۆ جوانی و ڕازاندنەوەی ماڵەکەت</p>

            <div class="links-grid">
                <a href="#" class="link-btn">تیکتۆک (TikTok) <i class="fa-brands fa-tiktok"></i></a>
                <a href="#" class="link-btn">فەیسبووک (Facebook) <i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="link-btn">واتسئاپ (WhatsApp) <i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: Math.random() * 0.03
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.globalAlpha = Math.abs(Math.sin(Date.now() * star.speed));
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>

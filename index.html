<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hane Home Design | Luxury Bio Link</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts & Kurdish Official Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=NRT+Reg:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'NRT Reg', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* باکگراوندی ئاڵتوونی و تاریقی شاهانە */
        .royal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at 50% 20%, #1a150c 0%, #080705 60%, #000000 100%);
        }

        /* نەیزەک و ئەستێرە جووڵاوەکان */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: rgba(12, 10, 7, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 32px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9),
                        0 0 50px rgba(212, 175, 55, 0.15);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
        }

        .profile-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
        }

        .profile-glow {
            position: absolute;
            inset: -6px;
            background: linear-gradient(45deg, #d4af37, #654d0a, #f3e5ab, #aa771c);
            border-radius: 50%;
            z-index: -1;
            filter: blur(14px);
            opacity: 0.8;
            animation: gold-pulse 3s infinite alternate;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes gold-pulse {
            0% { transform: scale(0.96); opacity: 0.6; }
            100% { transform: scale(1.04); opacity: 0.95; }
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 30%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.bio {
            font-size: 14px;
            color: #d4af37;
            margin-bottom: 24px;
            font-weight: 700;
            opacity: 0.9;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(212, 175, 55, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 12px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .link-btn:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: #d4af37;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.2);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #d4af37;
            transition: 0.3s;
        }

        .link-btn:hover .link-icon-box {
            transform: scale(1.1) rotate(5deg);
            background: #d4af37;
            color: #000;
        }

        .link-btn.tiktok:hover .link-icon-box { background: #fe2c55; color: #fff; border-color: #fe2c55; }
        .link-btn.facebook:hover .link-icon-box { background: #1877f2; color: #fff; border-color: #1877f2; }
        .link-btn.whatsapp:hover .link-icon-box { background: #25d366; color: #fff; border-color: #25d366; }
        .link-btn.map-btn:hover .link-icon-box { background: #10b981; color: #fff; border-color: #10b981; }

        .arrow-icon {
            color: #d4af37;
            font-size: 13px;
            opacity: 0.7;
            transition: transform 0.3s;
        }

        .link-btn:hover .arrow-icon {
            transform: translateX(-5px);
            opacity: 1;
        }

        /* بەشی نموونەی کارەکان */
        .portfolio-section {
            margin-top: 25px;
            position: relative;
            padding: 0 40px;
        }

        .portfolio-title {
            font-size: 16px;
            font-weight: 800;
            color: #d4af37;
            margin-bottom: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .portfolio-slider-container {
            position: relative;
            width: 100%;
        }

        .portfolio-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 8px 0;
            scrollbar-width: none;
        }

        .portfolio-slider::-webkit-scrollbar {
            display: none;
        }

        .portfolio-item {
            flex: 0 0 140px;
            height: 160px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.35);
            cursor: pointer;
            transition: 0.3s;
            background: #000;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .portfolio-item:hover img {
            transform: scale(1.08);
        }

        .portfolio-item:hover {
            border-color: #d4af37;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .arrow-btn {
            position: absolute;
            top: 55%;
            transform: translateY(-50%);
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.4);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .arrow-btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .left-arrow { left: -5px; }
        .right-arrow { right: -5px; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 16px;
            border: 2px solid #d4af37;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #d4af37;
            font-size: 30px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #d4af37;
            transition: 0.3s;
        }

        .close-modal:hover {
            background: #d4af37;
            color: #000;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
            font-weight: 600;
        }

        .footer span {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="royal-bg"></div>
    <canvas id="space-canvas"></canvas>

    <div class="wrapper">

    <script>
        function scrollSlider(direction) {
            const slider = document.getElementById('imageSlider');
            const scrollAmount = 200; 
            if (direction === 'left') {
                slider.scrollLeft -= scrollAmount;
            } else {
                slider.scrollLeft += scrollAmount;
            }
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'flex';
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let shootingStars = [];

        function init() {
            resize();
            createStars();
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);

        function createStars() {
            stars = [];
            const count = Math.floor((width * height) / 4500);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.004
                });
            }
        }

        /* دروستکردنی نەیزەکەکان بە زاویەی هەڕەمەکی بەرەو خوارەوە/پێشەوە */
        function createShootingStar() {
            if (Math.random() < 0.04 && shootingStars.length < 4) {
                // زاویەکە بە دەوری ۹۰ پلەدا (بەرەو خوارەوە/پێشەوە) بە هەڕەمەکی گۆڕانکاری تێدا دەکرێت
                const angle = (Math.PI / 2) + (Math.random() * 0.6 - 0.3);
                shootingStars.push({
                    x: Math.random() * width,
                    y: -50,
                    length: Math.random() * 90 + 50,
                    speed: Math.random() * 10 + 7,
                    angle: angle
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = '#d4af37';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.speed = -star.speed;
                }
            });

            createShootingStar();
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.85)';
            ctx.lineWidth = 2;

            shootingStars.forEach((ss, index) => {
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - ss.length * Math.cos(ss.angle), ss.y - ss.length * Math.sin(ss.angle));
                ctx.stroke();

                ss.x += ss.speed * Math.cos(ss.angle);
                ss.y += ss.speed * Math.sin(ss.angle);

                if (ss.y > height + 100 || ss.x < -100 || ss.x > width + 100) {
                    shootingStars.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
